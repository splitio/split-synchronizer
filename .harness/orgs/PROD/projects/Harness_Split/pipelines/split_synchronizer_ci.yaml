pipeline:
  name: split_synchronizer_ci
  identifier: split_synchronizer_ci
  projectIdentifier: Harness_Split
  orgIdentifier: PROD
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: fmegithubrunnersci
        repoName: split-synchronizer
        build: <+input>
        depth: 0
        sparseCheckout: []
  stages:
    - stage:
        name: Build and Test
        identifier: Build_and_Test
        type: CI
        spec:
          cloneCodebase: true
          envVariables:
            CI_ENABLE_HCLI_FOR_TESTS: "true"
          caching:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Run Tests
                  identifier: Run_Tests
                  spec:
                    connectorRef: dockerhub
                    image: golang:1.26.10
                    shell: Bash
                    command: |-
                      # Start Redis INSIDE the test container so the tests reach it at
                      # localhost:6379, matching the GitHub Actions `services: redis`
                      # behavior without modifying the Go tests (which hardcode
                      # localhost:6379).
                      #
                      # NOTE: a Harness `Background` step is NOT used here. On Harness
                      # Cloud infra a Background step runs as a SEPARATE container,
                      # reachable only at `redis:6379` (its step id) -- never localhost.
                      # Running redis-server in-container keeps it on the same network
                      # namespace so localhost:6379 resolves, as it did on GHA.
                      apt-get update && apt-get install -y redis-server
                      redis-server --daemonize yes

                      # Wait until Redis accepts connections before running tests.
                      for i in $(seq 1 30); do
                        if redis-cli ping 2>/dev/null | grep -q PONG; then
                          echo "Redis is up"; break
                        fi
                        echo "Waiting for Redis... ($i/30)"; sleep 1
                      done

                      make test_coverage
                    envVariables:
                      GOFLAGS: "-v"
              - step:
                  name: harnessCoverage
                  identifier: harnessCoverage
                  template:
                    templateRef: account.codeCoverage
                    versionLabel: v1
                    templateInputs:
                      type: Run
                      spec:
                        envVariables:
                          patch_coverage_percent: "80"
                          file_path: "coverage.out"
                          overall_coverage_percent: ""
                          ignore_failure: "true"
                          exclude: "**/*_test.go,**/vendor/**"

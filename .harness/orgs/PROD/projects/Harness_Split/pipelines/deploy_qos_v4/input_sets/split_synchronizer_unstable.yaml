inputSet:
  name: split_synchronizer_unstable
  tags: {}
  identifier: split_synchronizer_unstable
  orgIdentifier: PROD
  projectIdentifier: Harness_Split
  pipeline:
    identifier: deploy_qos_v4
    stages:
      - stage:
          identifier: CI
          type: CI
          spec:
            execution:
              steps:
                - step:
                    identifier: custom_tag
                    type: Run
                    spec:
                      command: |-
                        docker run --privileged --rm tonistiigi/binfmt --install all
                        export VERSION="$(git rev-parse --short HEAD)"
                      envVariables: {}
                    when:
                      condition: "true"
                - step:
                    identifier: BuildAndPush
                    type: BuildAndPushDockerRegistry
                    spec:
                      repo: split-<+matrix.app><+<+matrix.fips_mode>=="enabled"?"-fips":"">
                      tags:
                        - <+pipeline.stages.CI<+strategy.identifierPostFix>.spec.execution.steps.custom_tag.output.outputVariables.VERSION>
                        - latest
                      dockerfile: docker/Dockerfile.<+matrix.app>
                      context: ""
                      buildArgs:
                        FIPS_MODE: <+matrix.fips_mode>
                      envVariables:
                        PLUGIN_NO_PUSH: "false"
                        PLUGIN_BUILDX_LOAD: "false"
                        PLUGIN_PLATFORM: linux/amd64,linux/arm64
          strategy:
            matrix:
              app:
                - synchronizer
                - proxy
              fips_mode:
                - enabled
                - disabled
    properties:
      ci:
        codebase:
          build:
            type: branch
            spec:
              branch: <+trigger.branch>
